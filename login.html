<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - University of Eldoret Junior School</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <a class="brand" href="/"><span class="crest">UE</span><span>University of Eldoret Junior School</span></a>
      <h1>Sign in</h1>
      <p class="muted">For staff, parents and students. Your account is created by the school office.</p>
      <div id="loginAlert" class="alert alert-error hidden" role="alert"></div>
      <form id="loginForm" class="form" novalidate>
        <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"><div class="field-error" id="e_username" role="alert"></div></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><div class="field-error" id="e_password" role="alert"></div></div>
        <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
      </form>
      <p class="muted">Forgot your password? Ask the school office to issue a new temporary password.</p>
      <p><a href="/">Back to the school website</a></p>
    </div>
  </main>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
